<svg xmlns="http://www.w3.org/2000/svg" width="400" height="195" viewBox="0 0 400 195" fill="none" role="img" aria-labelledby="title desc">
<title id="title">About</title>
<desc id="desc">The problem leads The stack follows. I take software from an idea to something running in the real world. I&#39;ve written distributed shared memory in C, shipped Flutter apps, and a lot of command-line tools. The satisfying part is finishing it well enough to put it into the world. Focus: Retrieval, RAG, LLM pipelines Also: Computer vision, systems programming</desc>
